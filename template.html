<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR-Maxxer — Merged PR Dashboard</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #2f81f7;
    --green-1: #0e4429;
    --green-2: #006d32;
    --green-3: #26a641;
    --green-4: #39d353;
    --weekend: #10151c;
    --holiday: #3d1d0e;
    --vacation: #2d2440;
    --done: #8957e5;
    --validation: #bb8009;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .stat .value { font-size: 26px; font-weight: 600; margin-top: 4px; }
  .stat .note { color: var(--muted); font-size: 12px; margin-top: 2px; }

  .trend { margin-bottom: 28px; }
  .trend h2 { font-size: 15px; margin: 0 0 2px; }
  .trend .hint { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .trend-legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .trend-legend .key { display: inline-block; vertical-align: middle; margin-right: 6px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart .gridline { stroke: var(--border); stroke-width: 1; }
  .chart .axis-label { fill: var(--muted); font-size: 11px; }
  .chart .series { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .end-label { font-size: 11px; fill: var(--text); }
  .chart .crosshair { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  .chart .dot { stroke: var(--panel); stroke-width: 2; }
  .chart-tip {
    position: absolute; top: 0; pointer-events: none; display: none;
    background: #000; border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; font-size: 11px; white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
  }
  .chart-tip .row { display: flex; align-items: center; gap: 6px; }
  .chart-tip .row b { margin-left: auto; padding-left: 12px; font-weight: 600; }
  .chart-tip .sw { width: 8px; height: 8px; border-radius: 50%; }
  .chart-tip .muted { color: var(--muted); margin-bottom: 4px; }
  .trend details { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .trend table { border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .trend th, .trend td { padding: 2px 12px 2px 0; text-align: right; }
  .trend th:first-child, .trend td:first-child { text-align: left; }

  .cal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .cal-head .month { font-size: 18px; font-weight: 600; }
  .nav button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 16px;
    cursor: pointer;
  }
  .nav button:hover:not(:disabled) { border-color: var(--accent); }
  .nav button:disabled { opacity: .35; cursor: default; }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .dow {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .04em;
    padding-bottom: 4px;
  }
  .cell {
    position: relative;
    min-height: 64px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px;
    background: var(--panel);
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
  }
  .cell.empty { background: transparent; border-color: transparent; }
  .cell.weekend { background: var(--weekend); }
  .cell.holiday { background: var(--holiday); }
  .cell.vacation { background: var(--vacation); }
  .cell.today { outline: 2px solid var(--accent); outline-offset: -1px; }
  .cell.haspr { cursor: pointer; }
  .cell.haspr:hover, .cell.hasitems:hover { border-color: var(--accent); }

  .daynum { font-size: 12px; color: var(--muted); }
  .cell.today .daynum { color: var(--accent); font-weight: 700; }
  .tag { font-size: 9px; color: var(--muted); margin-top: 2px; line-height: 1.1; }

  .badge {
    margin-top: auto;
    align-self: flex-start;
    background: var(--green-2);
    color: #fff;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    padding: 2px 9px;
  }
  .badge.l1 { background: var(--green-1); }
  .badge.l2 { background: var(--green-2); }
  .badge.l3 { background: var(--green-3); color: #052e16; }
  .badge.l4 { background: var(--green-4); color: #052e16; }
  .badges { margin-top: auto; display: flex; flex-wrap: wrap; gap: 3px; }
  .badges .badge { margin-top: 0; }
  .badge.done { background: var(--done); }
  .badge.validation { background: var(--validation); color: #fff; }

  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 18px; font-size: 12px; color: var(--muted); }
  .legend .item { display: flex; align-items: center; gap: 6px; }
  .legend .swatch { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--border); display: inline-block; }
  .sw-weekend { background: var(--weekend); }
  .sw-holiday { background: var(--holiday); }
  .sw-vacation { background: var(--vacation); }
  .sw-pr { background: var(--green-3); }
  .sw-done { background: var(--done); }
  .sw-validation { background: var(--validation); }

  .tooltip {
    position: absolute;
    z-index: 10;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: #000;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    width: 240px;
    font-size: 11px;
    color: var(--text);
    display: none;
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
  }
  .cell.hasitems:hover .tooltip { display: block; }
  .tooltip .section { color: var(--muted); text-transform: uppercase; font-size: 9px; letter-spacing: .04em; margin: 6px 0 3px; }
  .tooltip .section:first-child { margin-top: 0; }
  .tooltip .pr { margin-bottom: 4px; }
  .tooltip .pr:last-child { margin-bottom: 0; }
  .tooltip .repo { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>PR-Maxxer</h1>
  <div class="sub" id="subtitle"></div>

  <div class="stats" id="stats"></div>

  <div class="trend">
    <h2>Last 7 days, over time</h2>
    <div class="hint">Per work day, trailing 7-day window ending on each date.</div>
    <div class="trend-legend" id="trendLegend"></div>
    <div class="chart" id="trendChart"></div>
    <details><summary>Show as table</summary><div id="trendTable"></div></details>
  </div>

  <div class="cal-head">
    <div class="month" id="monthLabel"></div>
    <div class="nav">
      <button id="prevBtn" aria-label="Previous month">&larr;</button>
      <button id="nextBtn" aria-label="Next month">&rarr;</button>
    </div>
  </div>

  <div class="grid" id="dowRow"></div>
  <div class="grid" id="calGrid" style="margin-top:6px;"></div>

  <div class="legend">
    <div class="item"><span class="swatch sw-pr"></span> merged PRs (click day to view on GitHub)</div>
    <div class="item linear-only"><span class="swatch sw-done"></span> Linear done</div>
    <div class="item linear-only"><span class="swatch sw-validation"></span> Linear moved to validation</div>
    <div class="item"><span class="swatch sw-weekend"></span> weekend</div>
    <div class="item"><span class="swatch sw-holiday"></span> holiday</div>
    <div class="item"><span class="swatch sw-vacation"></span> vacation</div>
  </div>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById("data").textContent);
  const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const MONTH_NAMES = ["January","February","March","April","May","June",
    "July","August","September","October","November","December"];

  // Parse a YYYY-MM-DD string as a *local* date (avoid UTC shift from new Date(str)).
  function parseDate(s) {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  function iso(d) {
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }
  function monthKey(year, month) {
    return year + "-" + String(month + 1).padStart(2, "0");
  }

  const rangeStart = parseDate(DATA.rangeStart);
  const rangeEnd = parseDate(DATA.rangeEnd);
  const startYM = { y: rangeStart.getFullYear(), m: rangeStart.getMonth() };
  const endYM = { y: rangeEnd.getFullYear(), m: rangeEnd.getMonth() };
  const todayIso = DATA.rangeEnd; // range end is "today" at generation time.

  // The browser's local TZ offset for the day-link datetime range.
  function tzOffset(d) {
    const mins = -d.getTimezoneOffset();
    const sign = mins >= 0 ? "+" : "-";
    const abs = Math.abs(mins);
    return sign + String(Math.floor(abs / 60)).padStart(2, "0") + ":" +
      String(abs % 60).padStart(2, "0");
  }

  // GitHub search URL scoping to PRs merged on a given local day.
  function githubSearchUrl(dayIso) {
    const off = tzOffset(parseDate(dayIso));
    const range = dayIso + "T00:00:00" + off + ".." + dayIso + "T23:59:59" + off;
    const q = "author:" + DATA.login + " is:pr is:merged merged:" + range;
    return "https://github.com/search?q=" + encodeURIComponent(q) + "&type=pullrequests";
  }

  function badgeLevel(n) {
    if (n >= 5) return "l4";
    if (n >= 3) return "l3";
    if (n >= 2) return "l2";
    return "l1";
  }

  // Current view month, clamped to range; start at the latest month.
  let view = { y: endYM.y, m: endYM.m };

  function compareYM(a, b) {
    return (a.y * 12 + a.m) - (b.y * 12 + b.m);
  }

  const WINDOWS = [
    ["Last 7 days", DATA.stats.last7],
    ["Last 30 days", DATA.stats.last30],
    ["Full range", DATA.stats.overall],
  ];

  function statCard(label, value, note) {
    return '<div class="stat"><div class="label">' + label + '</div>' +
      '<div class="value">' + value + '</div><div class="note">' + note + '</div></div>';
  }

  function renderStats() {
    const el = document.getElementById("stats");
    let html = WINDOWS.map(function (w) {
      return statCard(w[0] + " · PRs", w[1].prsPerWorkDay,
        w[1].totalPRs + " PRs · " + w[1].workDays + " work days");
    }).join("");
    if (DATA.linearEnabled) {
      html += WINDOWS.map(function (w) {
        return statCard(w[0] + " · Linear done", w[1].linearDonePerWorkDay,
          w[1].linearDone + " issues · " + w[1].workDays + " work days");
      }).join("");
      html += WINDOWS.map(function (w) {
        return statCard(w[0] + " · To validation", w[1].linearValidationPerWorkDay,
          w[1].linearValidation + " issues · " + w[1].workDays + " work days");
      }).join("");
    }
    el.innerHTML = html;
  }

  const SERIES = [
    { key: "prs", label: "PRs", color: "var(--green-3)" },
    { key: "done", label: "Linear done", color: "var(--done)", linear: true },
    // Dashed: it often tracks PRs exactly, so the solid line underneath must show through.
    { key: "validation", label: "To validation", color: "var(--validation)", linear: true, dash: "6 5" },
  ].filter(function (s) { return !s.linear || DATA.linearEnabled; });

  function renderTrend() {
    const rows = DATA.stats.rolling7;
    const chart = document.getElementById("trendChart");
    if (!rows.length) { chart.textContent = "Not enough days in range yet."; return; }

    document.getElementById("trendLegend").innerHTML = SERIES.map(function (s) {
      return '<span><svg class="key" width="18" height="4"><line x1="1" x2="17" y1="2" y2="2" stroke-width="2" ' +
        'stroke-linecap="round" style="stroke:' + s.color + '"' + (s.dash ? ' stroke-dasharray="' + s.dash + '"' : "") +
        "/></svg>" + s.label + "</span>";
    }).join("");

    const W = chart.clientWidth || 820, H = 220;
    const M = { top: 10, right: 92, bottom: 22, left: 32 };
    const iw = W - M.left - M.right, ih = H - M.top - M.bottom;
    let max = 0;
    rows.forEach(function (r) { SERIES.forEach(function (s) { if (r[s.key] > max) max = r[s.key]; }); });
    const step = max <= 1 ? 0.25 : max <= 2 ? 0.5 : 1;
    const yMax = Math.max(step, Math.ceil(max / step) * step);
    const x = function (i) { return M.left + (rows.length === 1 ? iw / 2 : i * iw / (rows.length - 1)); };
    const y = function (v) { return M.top + ih - v / yMax * ih; };

    let svg = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Trailing 7-day rates per work day">';
    for (let v = 0; v <= yMax + 1e-9; v += step) {
      svg += '<line class="gridline" x1="' + M.left + '" x2="' + (W - M.right) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>';
      svg += '<text class="axis-label" x="' + (M.left - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + +v.toFixed(2) + "</text>";
    }
    // Month-start ticks on the x axis.
    rows.forEach(function (r, i) {
      if (r.date.slice(8) === "01" || i === 0) {
        const d = parseDate(r.date);
        svg += '<text class="axis-label" x="' + x(i) + '" y="' + (H - 4) + '" text-anchor="' + (i === 0 ? "start" : "middle") + '">' +
          MONTH_NAMES[d.getMonth()].slice(0, 3) + " " + d.getDate() + "</text>";
      }
    });

    // One path per series; null values (no work days in window) break the line.
    const ends = [];
    SERIES.forEach(function (s) {
      let d = "", pen = false, last = null;
      rows.forEach(function (r, i) {
        const v = r[s.key];
        if (v === null) { pen = false; return; }
        d += (pen ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1);
        pen = true; last = { i: i, v: v };
      });
      svg += '<path class="series" d="' + d + '" style="stroke:' + s.color + '"' +
        (s.dash ? ' stroke-dasharray="' + s.dash + '" stroke-linecap="butt"' : "") + "/>";
      if (last) ends.push({ s: s, y: y(last.v), v: last.v });
    });
    // Direct end labels, nudged apart so they don't collide.
    ends.sort(function (a, b) { return a.y - b.y; });
    for (let i = 1; i < ends.length; i++) {
      if (ends[i].y - ends[i - 1].y < 13) ends[i].y = ends[i - 1].y + 13;
    }
    ends.forEach(function (e) {
      svg += '<text class="end-label" x="' + (W - M.right + 6) + '" y="' + (e.y + 4) + '">' + e.s.label + " " + e.v + "</text>";
    });
    svg += '<g id="trendHover" style="display:none"><line class="crosshair" y1="' + M.top + '" y2="' + (M.top + ih) + '"/>' +
      SERIES.map(function (s) { return '<circle class="dot" r="4" style="fill:' + s.color + '"/>'; }).join("") + "</g>";
    svg += '<rect x="' + M.left + '" y="0" width="' + iw + '" height="' + H + '" fill="transparent" id="trendHit"/>';
    svg += "</svg>";
    chart.innerHTML = svg + '<div class="chart-tip" id="trendTip"></div>';

    const hover = document.getElementById("trendHover");
    const tip = document.getElementById("trendTip");
    const svgEl = chart.querySelector("svg");
    document.getElementById("trendHit").addEventListener("mousemove", function (ev) {
      const rect = svgEl.getBoundingClientRect();
      const px = (ev.clientX - rect.left) * W / rect.width;
      const i = Math.max(0, Math.min(rows.length - 1,
        Math.round((px - M.left) / iw * (rows.length - 1))));
      const r = rows[i];
      hover.style.display = "";
      hover.querySelector("line").setAttribute("x1", x(i));
      hover.querySelector("line").setAttribute("x2", x(i));
      hover.querySelectorAll("circle").forEach(function (c, k) {
        const v = r[SERIES[k].key];
        c.style.display = v === null ? "none" : "";
        if (v !== null) { c.setAttribute("cx", x(i)); c.setAttribute("cy", y(v)); }
      });
      tip.innerHTML = '<div class="muted">' + parseDate(r.date).toDateString().slice(4) + " · 7d ending · " +
        r.workDays + " work days</div>" + SERIES.map(function (s) {
          return '<div class="row"><span class="sw" style="background:' + s.color + '"></span>' + s.label +
            "<b>" + (r[s.key] === null ? "—" : r[s.key]) + "</b></div>";
        }).join("");
      tip.style.display = "block";
      const left = x(i) / W * rect.width;
      tip.style.left = (left > rect.width / 2 ? left - tip.offsetWidth - 12 : left + 12) + "px";
    });
    document.getElementById("trendHit").addEventListener("mouseleave", function () {
      hover.style.display = "none"; tip.style.display = "none";
    });

    document.getElementById("trendTable").innerHTML = "<table><tr><th>7d ending</th><th>Work days</th>" +
      SERIES.map(function (s) { return "<th>" + s.label + "</th>"; }).join("") + "</tr>" +
      rows.slice().reverse().map(function (r) {
        return "<tr><td>" + r.date + "</td><td>" + r.workDays + "</td>" + SERIES.map(function (s) {
          return "<td>" + (r[s.key] === null ? "—" : r[s.key]) + "</td>";
        }).join("") + "</tr>";
      }).join("") + "</table>";
  }

  function tooltipHtml(prs, linear) {
    let html = "";
    function section(title, rows) {
      if (!rows.length) return;
      html += '<div class="section">' + title + "</div>" + rows.join("");
    }
    section("Merged PRs", prs.map(function (p) {
      return '<div class="pr">#' + p.number + ' ' + escapeHtml(p.title) +
        '<br><span class="repo">' + escapeHtml(p.repo) + '</span></div>';
    }));
    function issueRow(i) {
      return '<div class="pr">' + escapeHtml(i.identifier) + ' ' + escapeHtml(i.title) + '</div>';
    }
    section("Linear done", linear.done.map(issueRow));
    section("Moved to validation", linear.validation.map(issueRow));
    return '<div class="tooltip">' + html + '</div>';
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderCalendar() {
    document.getElementById("monthLabel").textContent = MONTH_NAMES[view.m] + " " + view.y;

    const dowRow = document.getElementById("dowRow");
    dowRow.innerHTML = DOW.map(function (d) { return '<div class="dow">' + d + "</div>"; }).join("");

    const first = new Date(view.y, view.m, 1);
    const daysInMonth = new Date(view.y, view.m + 1, 0).getDate();
    const leadingBlanks = first.getDay(); // 0 = Sunday

    const cells = [];
    for (let i = 0; i < leadingBlanks; i++) {
      cells.push('<div class="cell empty"></div>');
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const d = new Date(view.y, view.m, day);
      const dayIso = iso(d);
      const inRange = d >= rangeStart && d <= rangeEnd;
      const prs = DATA.prsByDate[dayIso] || [];
      const linear = DATA.linearByDate[dayIso] || { done: [], validation: [] };
      const hasItems = prs.length || linear.done.length || linear.validation.length;
      const isWeekend = d.getDay() === 0 || d.getDay() === 6;
      const holidayName = DATA.holidays[dayIso];
      const vacLabel = DATA.vacations[dayIso];

      const classes = ["cell"];
      if (isWeekend) classes.push("weekend");
      if (holidayName) classes.push("holiday");
      if (vacLabel) classes.push("vacation");
      if (dayIso === todayIso) classes.push("today");
      if (prs.length) classes.push("haspr");
      if (hasItems) classes.push("hasitems");
      if (!inRange) classes.push("empty");

      let inner = '<div class="daynum">' + day + "</div>";
      if (holidayName) inner += '<div class="tag">' + escapeHtml(holidayName) + "</div>";
      else if (vacLabel) inner += '<div class="tag">' + escapeHtml(vacLabel) + "</div>";

      if (hasItems) {
        inner += '<div class="badges">';
        if (prs.length) {
          inner += '<span class="badge ' + badgeLevel(prs.length) + '" title="Merged PRs">' +
            prs.length + "</span>";
        }
        if (linear.done.length) {
          inner += '<span class="badge done" title="Linear done">' + linear.done.length + "</span>";
        }
        if (linear.validation.length) {
          inner += '<span class="badge validation" title="Moved to validation">' +
            linear.validation.length + "</span>";
        }
        inner += "</div>" + tooltipHtml(prs, linear);
      }

      if (prs.length && inRange) {
        cells.push('<a class="' + classes.join(" ") + '" href="' +
          githubSearchUrl(dayIso) + '" target="_blank" rel="noopener">' + inner + "</a>");
      } else {
        cells.push('<div class="' + classes.join(" ") + '">' + inner + "</div>");
      }
    }

    document.getElementById("calGrid").innerHTML = cells.join("");

    document.getElementById("prevBtn").disabled = compareYM(view, startYM) <= 0;
    document.getElementById("nextBtn").disabled = compareYM(view, endYM) >= 0;
  }

  function shiftMonth(delta) {
    const idx = view.y * 12 + view.m + delta;
    const next = { y: Math.floor(idx / 12), m: idx % 12 };
    if (compareYM(next, startYM) < 0 || compareYM(next, endYM) > 0) return;
    view = next;
    render();
  }

  function render() {
    renderStats();
    renderCalendar();
  }

  document.getElementById("prevBtn").addEventListener("click", function () { shiftMonth(-1); });
  document.getElementById("nextBtn").addEventListener("click", function () { shiftMonth(1); });

  document.getElementById("subtitle").textContent =
    "@" + DATA.login + " · " + DATA.rangeStart + " → " + DATA.rangeEnd +
    " · " + DATA.timezone + " · generated " + DATA.generatedAt;

  if (!DATA.linearEnabled) {
    document.querySelectorAll(".linear-only").forEach(function (el) { el.remove(); });
  }

  render();
  renderTrend();
  window.addEventListener("resize", renderTrend);
})();
</script>
</body>
</html>
